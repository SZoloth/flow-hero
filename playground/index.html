<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>flow-hero playground</title>
<style>
  :root {
    --fg: #f5f5f4;
    --fg-muted: rgb(245 245 244 / 0.66);
    --panel-bg: rgb(16 16 18 / 0.72);
    --panel-fg: #f5f5f4;
    --panel-muted: #a8a29e;
    --panel-line: rgb(255 255 255 / 0.1);
    --accent: #f5f5f4;
    color-scheme: dark;
  }
  :root[data-tone="light"] { --fg: #1c1917; --fg-muted: rgb(28 25 23 / 0.7); }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: #000; font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  #hero { position: relative; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 96px 16px; text-align: center; color: var(--fg); }
  .copy { max-width: 760px; }
  .eyebrow { display: inline-block; padding: 4px 12px; border: 1px solid currentColor; border-radius: 999px; font-size: 13px; opacity: 0.7; }
  h1 { font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 1.04; font-weight: 500; letter-spacing: -0.035em; margin: 20px 0 16px; text-wrap: balance; }
  .lede { margin: 0 auto; max-width: 34ch; font-size: clamp(1rem, 2.2vw, 1.2rem); color: var(--fg-muted); text-wrap: pretty; }
  .cta { display: inline-block; margin-top: 28px; height: auto; padding: 10px 18px; border: 0; border-radius: 8px; background: var(--fg); color: #000; font-size: 15px; font-weight: 500; }
  .cta:hover { background: var(--fg); opacity: 0.88; }
  :root[data-tone="light"] .cta { color: #fff; }
  .intro { animation: intro 1s cubic-bezier(0.16, 1, 0.3, 1) both; animation-delay: calc(var(--intro-index, 0) * 0.12s); }
  @keyframes intro { from { opacity: 0; filter: blur(8px); transform: translateY(24px); } }
  @media (prefers-reduced-motion: reduce) { .intro { animation: none; } }

  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: 300px; display: flex; flex-direction: column; color: var(--panel-fg); background: var(--panel-bg); backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); border: 1px solid var(--panel-line); border-radius: 14px; overflow: hidden; z-index: 2; }
  #panel header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 10px; border-bottom: 1px solid var(--panel-line); }
  #panel header strong { font-size: 13px; letter-spacing: 0.01em; flex: 1; white-space: nowrap; }
  #panel .body { overflow-y: auto; padding: 4px 12px 12px; overscroll-behavior: contain; }
  #panel .actions { display: flex; align-items: center; gap: 6px; padding: 10px 12px 12px; border-top: 1px solid var(--panel-line); }
  #panel .actions span { flex: 1; font-size: 12.5px; color: var(--panel-muted); }
  fieldset { border: 0; margin: 0; padding: 10px 0 4px; border-bottom: 1px solid var(--panel-line); }
  fieldset:last-child { border-bottom: 0; }
  legend { padding: 0; margin-bottom: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--panel-muted); }
  .row { display: grid; grid-template-columns: 84px 1fr 44px; align-items: center; gap: 8px; min-height: 30px; }
  .row label { font-size: 12.5px; color: var(--panel-muted); }
  .row output { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; text-align: right; font-variant-numeric: tabular-nums; color: var(--panel-fg); }
  .row.wide { grid-template-columns: 84px 1fr; }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  input[type="color"] { width: 28px; height: 22px; padding: 0; border: 1px solid var(--panel-line); border-radius: 5px; background: none; cursor: pointer; }
  input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type="color"]::-webkit-color-swatch { border: 0; border-radius: 4px; }
  input[type="text"], select { width: 100%; height: 26px; padding: 0 8px; font: inherit; font-size: 12.5px; color: var(--panel-fg); background: rgb(255 255 255 / 0.06); border: 1px solid var(--panel-line); border-radius: 6px; }
  .swatches { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  button { height: 30px; padding: 0 10px; font: inherit; font-size: 12.5px; font-weight: 500; color: var(--panel-fg); background: rgb(255 255 255 / 0.08); border: 1px solid var(--panel-line); border-radius: 7px; cursor: pointer; }
  button:hover { background: rgb(255 255 255 / 0.14); }
  button.small { height: 22px; min-width: 22px; padding: 0 6px; font-size: 13px; line-height: 1; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 1px; }
  #toggle { display: none; }
  :root[data-bare] #panel { display: none; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px; background: rgb(0 0 0 / 0.8); color: #fff; font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none; z-index: 3; }
  #toast[data-show] { opacity: 1; }
  @media (max-width: 720px) {
    #panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 64vh; }
    #panel:not([data-open]) .body, #panel:not([data-open]) .actions { display: none; }
    #toggle { display: inline-block; }
  }
</style>
</head>
<body>
<section id="hero">
  <div class="copy">
    <span class="eyebrow intro" style="--intro-index:0">Open source, zero dependencies</span>
    <h1 class="intro" style="--intro-index:1">A hero that follows your hand</h1>
    <p class="lede intro" style="--intro-index:2">Move the pointer to leave smoke. Every setting is one field in a small JSON patch you can share.</p>
    <button class="cta intro" style="--intro-index:3" type="button" id="cta">Copy this look</button>
  </div>
</section>
<aside id="panel" aria-label="Settings">
  <header>
    <strong>flow-hero</strong>
    <select id="preset" aria-label="Preset"></select>
    <button id="random" type="button">Random</button>
    <button id="toggle" type="button" aria-expanded="false" aria-controls="panel-body">Edit</button>
  </header>
  <div class="body" id="panel-body"></div>
  <div class="actions">
    <span>Copy</span>
    <button id="copy-json" type="button" aria-label="Copy patch JSON">Patch JSON</button>
    <button id="copy-html" type="button" aria-label="Copy HTML snippet">HTML</button>
    <button id="copy-react" type="button" aria-label="Copy React snippet">React</button>
  </div>
</aside>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module" src="./build/main.js"></script>
</body>
</html>
