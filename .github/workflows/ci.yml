name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - name: Pack the package as npm would publish it
        run: pnpm pack
      - name: Build the Next.js example against the packed package
        working-directory: examples/next
        run: |
          pnpm add "../../flow-hero-$(node -p "require('../../package.json').version").tgz" --ignore-workspace
          pnpm build
