name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm size
      - name: Pack the package as npm would publish it
        run: pnpm pack
      - name: Build the Next.js example against the packed package
        working-directory: examples/next
        run: |
          node -e "const f='package.json',p=require('./'+f),v=require('../../package.json').version;p.dependencies['flow-hero']='file:../../flow-hero-'+v+'.tgz';require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          pnpm install --ignore-workspace
          pnpm build
