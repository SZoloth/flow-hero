<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flow-hero in plain HTML</title>
<script src="https://unpkg.com/flow-hero@0.3.0/dist/flow-hero.iife.js"></script>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f6f1e7; }
  flow-hero { display: grid; place-items: center; min-height: 100vh; color: #16130f; }
</style>
</head>
<body>
<flow-hero preset="ink-on-paper" patch='{"ink":{"color":"#1d3557"}}'>
  <h1>Your headline</h1>
</flow-hero>
</body>
</html>
